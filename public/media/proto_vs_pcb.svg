<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Left: 1° Medio Protoboard -->
  <g transform="translate(40, 30)">
    <rect width="440" height="500" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <rect width="440" height="55" rx="20" fill="#10b981" />
    <rect y="35" width="440" height="20" fill="#10b981" />
    <text x="220" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="900" text-anchor="middle">1° MEDIO: PROTOBOARD (PROTOTIPO)</text>

    <!-- Protoboard body -->
    <rect x="30" y="80" width="380" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Holes matrix -->
    <g fill="#94a3b8">
      <circle cx="65" cy="110" r="3" /><circle cx="89" cy="110" r="3" /><circle cx="113" cy="110" r="3" /><circle cx="137" cy="110" r="3" /><circle cx="161" cy="110" r="3" /><circle cx="185" cy="110" r="3" /><circle cx="209" cy="110" r="3" /><circle cx="233" cy="110" r="3" /><circle cx="257" cy="110" r="3" /><circle cx="281" cy="110" r="3" /><circle cx="305" cy="110" r="3" /><circle cx="329" cy="110" r="3" /><circle cx="353" cy="110" r="3" /><circle cx="377" cy="110" r="3" /><circle cx="65" cy="134" r="3" /><circle cx="89" cy="134" r="3" /><circle cx="113" cy="134" r="3" /><circle cx="137" cy="134" r="3" /><circle cx="161" cy="134" r="3" /><circle cx="185" cy="134" r="3" /><circle cx="209" cy="134" r="3" /><circle cx="233" cy="134" r="3" /><circle cx="257" cy="134" r="3" /><circle cx="281" cy="134" r="3" /><circle cx="305" cy="134" r="3" /><circle cx="329" cy="134" r="3" /><circle cx="353" cy="134" r="3" /><circle cx="377" cy="134" r="3" /><circle cx="65" cy="158" r="3" /><circle cx="89" cy="158" r="3" /><circle cx="113" cy="158" r="3" /><circle cx="137" cy="158" r="3" /><circle cx="161" cy="158" r="3" /><circle cx="185" cy="158" r="3" /><circle cx="209" cy="158" r="3" /><circle cx="233" cy="158" r="3" /><circle cx="257" cy="158" r="3" /><circle cx="281" cy="158" r="3" /><circle cx="305" cy="158" r="3" /><circle cx="329" cy="158" r="3" /><circle cx="353" cy="158" r="3" /><circle cx="377" cy="158" r="3" /><circle cx="65" cy="182" r="3" /><circle cx="89" cy="182" r="3" /><circle cx="113" cy="182" r="3" /><circle cx="137" cy="182" r="3" /><circle cx="161" cy="182" r="3" /><circle cx="185" cy="182" r="3" /><circle cx="209" cy="182" r="3" /><circle cx="233" cy="182" r="3" /><circle cx="257" cy="182" r="3" /><circle cx="281" cy="182" r="3" /><circle cx="305" cy="182" r="3" /><circle cx="329" cy="182" r="3" /><circle cx="353" cy="182" r="3" /><circle cx="377" cy="182" r="3" /><circle cx="65" cy="206" r="3" /><circle cx="89" cy="206" r="3" /><circle cx="113" cy="206" r="3" /><circle cx="137" cy="206" r="3" /><circle cx="161" cy="206" r="3" /><circle cx="185" cy="206" r="3" /><circle cx="209" cy="206" r="3" /><circle cx="233" cy="206" r="3" /><circle cx="257" cy="206" r="3" /><circle cx="281" cy="206" r="3" /><circle cx="305" cy="206" r="3" /><circle cx="329" cy="206" r="3" /><circle cx="353" cy="206" r="3" /><circle cx="377" cy="206" r="3" /><circle cx="65" cy="230" r="3" /><circle cx="89" cy="230" r="3" /><circle cx="113" cy="230" r="3" /><circle cx="137" cy="230" r="3" /><circle cx="161" cy="230" r="3" /><circle cx="185" cy="230" r="3" /><circle cx="209" cy="230" r="3" /><circle cx="233" cy="230" r="3" /><circle cx="257" cy="230" r="3" /><circle cx="281" cy="230" r="3" /><circle cx="305" cy="230" r="3" /><circle cx="329" cy="230" r="3" /><circle cx="353" cy="230" r="3" /><circle cx="377" cy="230" r="3" /><circle cx="65" cy="254" r="3" /><circle cx="89" cy="254" r="3" /><circle cx="113" cy="254" r="3" /><circle cx="137" cy="254" r="3" /><circle cx="161" cy="254" r="3" /><circle cx="185" cy="254" r="3" /><circle cx="209" cy="254" r="3" /><circle cx="233" cy="254" r="3" /><circle cx="257" cy="254" r="3" /><circle cx="281" cy="254" r="3" /><circle cx="305" cy="254" r="3" /><circle cx="329" cy="254" r="3" /><circle cx="353" cy="254" r="3" /><circle cx="377" cy="254" r="3" /><circle cx="65" cy="278" r="3" /><circle cx="89" cy="278" r="3" /><circle cx="113" cy="278" r="3" /><circle cx="137" cy="278" r="3" /><circle cx="161" cy="278" r="3" /><circle cx="185" cy="278" r="3" /><circle cx="209" cy="278" r="3" /><circle cx="233" cy="278" r="3" /><circle cx="257" cy="278" r="3" /><circle cx="281" cy="278" r="3" /><circle cx="305" cy="278" r="3" /><circle cx="329" cy="278" r="3" /><circle cx="353" cy="278" r="3" /><circle cx="377" cy="278" r="3" /><circle cx="65" cy="302" r="3" /><circle cx="89" cy="302" r="3" /><circle cx="113" cy="302" r="3" /><circle cx="137" cy="302" r="3" /><circle cx="161" cy="302" r="3" /><circle cx="185" cy="302" r="3" /><circle cx="209" cy="302" r="3" /><circle cx="233" cy="302" r="3" /><circle cx="257" cy="302" r="3" /><circle cx="281" cy="302" r="3" /><circle cx="305" cy="302" r="3" /><circle cx="329" cy="302" r="3" /><circle cx="353" cy="302" r="3" /><circle cx="377" cy="302" r="3" /><circle cx="65" cy="326" r="3" /><circle cx="89" cy="326" r="3" /><circle cx="113" cy="326" r="3" /><circle cx="137" cy="326" r="3" /><circle cx="161" cy="326" r="3" /><circle cx="185" cy="326" r="3" /><circle cx="209" cy="326" r="3" /><circle cx="233" cy="326" r="3" /><circle cx="257" cy="326" r="3" /><circle cx="281" cy="326" r="3" /><circle cx="305" cy="326" r="3" /><circle cx="329" cy="326" r="3" /><circle cx="353" cy="326" r="3" /><circle cx="377" cy="326" r="3" />
    </g>

    <!-- Components on breadboard -->
    <!-- Resistor -->
    <rect x="135" y="170" width="60" height="20" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
    <line x1="145" y1="170" x2="145" y2="190" stroke="#dc2626" stroke-width="3" />
    <line x1="155" y1="170" x2="155" y2="190" stroke="#dc2626" stroke-width="3" />
    <line x1="165" y1="170" x2="165" y2="190" stroke="#78350f" stroke-width="3" />
    <line x1="175" y1="170" x2="175" y2="190" stroke="#ca8a04" stroke-width="3" />
    <line x1="110" y1="180" x2="135" y2="180" stroke="#64748b" stroke-width="3" />
    <line x1="195" y1="180" x2="230" y2="180" stroke="#64748b" stroke-width="3" />

    <!-- LED -->
    <circle cx="270" cy="180" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
    <line x1="270" y1="196" x2="270" y2="240" stroke="#dc2626" stroke-width="3" />

    <!-- Loose Jumper wires -->
    <path d="M 90 140 Q 60 260 110 300" fill="none" stroke="#2563eb" stroke-width="4" />
    <path d="M 230 180 Q 290 280 320 220" fill="none" stroke="#f59e0b" stroke-width="4" />

    <!-- Features -->
    <rect x="30" y="400" width="380" height="85" rx="12" fill="#f1f5f9" />
    <text x="50" y="428" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">✓ Conexión rápida sin soldar</text>
    <text x="50" y="450" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">✓ Permite equivocarse y corregir al instante</text>
    <text x="50" y="472" fill="#dc2626" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">✗ Falla con vibraciones de un dron</text>
  </g>

  <!-- Right: 2° Medio PCB -->
  <g transform="translate(520, 30)">
    <rect width="440" height="500" rx="20" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <rect width="440" height="55" rx="20" fill="#06b6d4" />
    <rect y="35" width="440" height="20" fill="#06b6d4" />
    <text x="220" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="900" text-anchor="middle">2° MEDIO: PLACA PCB SOLDADA</text>

    <!-- PCB board -->
    <rect x="30" y="80" width="380" height="300" rx="10" fill="url(#pcbGreen)" stroke="#10b981" stroke-width="3" />
    
    <!-- Copper traces and solder pads -->
    <g stroke="#fbbf24" stroke-width="3" fill="none">
      <path d="M 60 120 L 140 120 L 180 160 L 260 160" />
      <path d="M 60 180 L 120 180 L 160 220 L 320 220" />
      <path d="M 260 160 L 340 160 L 370 190" />
      <path d="M 120 300 L 180 300 L 220 260 L 360 260" />
    </g>

    <!-- Shiny Solder Pads -->
    <g fill="#e2e8f0" stroke="#047857" stroke-width="2">
      <circle cx="60" cy="120" r="7" />
      <circle cx="60" cy="180" r="7" />
      <circle cx="260" cy="160" r="7" />
      <circle cx="320" cy="220" r="7" />
      <circle cx="370" cy="190" r="7" />
      <circle cx="120" cy="300" r="7" />
      <circle cx="360" cy="260" r="7" />
    </g>

    <!-- Surface Mount Chip / IC -->
    <rect x="180" y="190" width="80" height="60" rx="4" fill="#18181b" stroke="#94a3b8" stroke-width="1.5" />
    <text x="220" y="225" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MCU-ARM</text>

    <!-- Silkscreen text -->
    <text x="60" y="350" fill="#ffffff" font-family="monospace" font-size="12" opacity="0.8">LICEO SAN NICOLAS - GEOGO II</text>

    <!-- Features -->
    <rect x="30" y="400" width="380" height="85" rx="12" fill="#1e293b" />
    <text x="50" y="428" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">✓ Pistas de cobre integradas al milímetro</text>
    <text x="50" y="450" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">✓ Puntos soldados con estaño indeformables</text>
    <text x="50" y="472" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">✓ Diseñada para volar en drones y robots</text>
  </g>
</svg>